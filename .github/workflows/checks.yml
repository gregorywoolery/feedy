name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedy
          POSTGRES_PASSWORD: feedy
          POSTGRES_DB: feedy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedy -d feedy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://feedy:feedy@127.0.0.1:5432/feedy_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://feedy:feedy@127.0.0.1:5432/feedy_test?sslmode=disable
      STORAGE_DRIVER: database
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - name: Build production container
        run: docker build --tag feedy:ci .
      - run: npx playwright install --with-deps chromium
      - name: Start production container
        run: |
          docker run --detach --name feedy-ci --network host --env DATABASE_URL --env STORAGE_DRIVER feedy:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs feedy-ci
          exit 1
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Container logs
        if: failure()
        run: docker logs feedy-ci || true
      - name: Stop production container
        if: always()
        run: docker rm --force feedy-ci || true
